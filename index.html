<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Discord Web Proxy Client</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #2f3136; color: white; padding: 25px; }
        #chatBox { border: 1px solid #40444b; height: 400px; width: 550px; overflow-y: auto; padding: 15px; background: #36393f; border-radius: 6px; margin-bottom: 12px; }
        .msg { margin-bottom: 10px; padding: 8px; border-radius: 4px; line-height: 1.4; }
        .you { background: #4f545c; color: #00efff; border-left: 4px solid #00efff; }
        .them { background: #40444b; color: #43b581; border-left: 4px solid #43b581; }
        input, button { padding: 12px; border-radius: 4px; border: none; font-size: 14px; }
        input { background: #40444b; color: white; outline: none; }
        button { background: #5865F2; color: white; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #4752c4; }
    </style>
</head>
<body>

    <h2>💬 Live Discord Web DM Proxy</h2>
    
    <div style="margin-bottom: 15px;">
        <label>Active Chat Target (Discord User ID): </label>
        <input type="text" id="userIdInput" placeholder="Paste target User ID here..." style="width: 250px;">
    </div>

    <div id="chatBox">
        <p style="color: #b9bbbe; font-style: italic; text-align: center;">Provide a Discord User ID above to target your outbound messages. Live incoming messages will pop up automatically here.</p>
    </div>

    <input type="text" id="messageInput" placeholder="Type a message to send..." style="width: 420px;" onkeypress="handleKey(event)">
    <button onclick="sendMessage()">Send DM</button>

    <script>
        const socket = io();

        // Catch live arriving DMs from Discord
        socket.on('incoming_discord_dm', (data) => {
            const currentTargetId = document.getElementById('userIdInput').value.trim();
            const chatBox = document.getElementById('chatBox');
            
            // Highlight if it matches who you are currently typing to
            const isCurrentChat = (data.userId === currentTargetId);
            const tag = isCurrentChat ? "" : ` [ID: ${data.userId}]`;

            chatBox.innerHTML += `<div class="msg them"><strong>[${data.username}${tag}]:</strong> ${data.text}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        socket.on('error_status', (err) => {
            alert(err);
        });

        function sendMessage() {
            const targetUserId = document.getElementById('userIdInput').value.trim();
            const text = document.getElementById('messageInput').value.trim();

            if (!targetUserId) return alert("Please specify a Target Discord User ID before sending!");
            if (!text) return;

            // Stream payload to backend
            socket.emit('send_website_message', { targetUserId, messageText: text });

            // Render text locally on screen immediately
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `<div class="msg you"><strong>[You]:</strong> ${text}</div>`;
            document.getElementById('messageInput').value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
